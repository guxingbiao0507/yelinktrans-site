seo:
  title: "Privacy Policy | Yelinktrans"
  description: "Learn how Yelinktrans handles and protects personal information when you visit this website or contact us by email."

hero:
  eyebrow: "PRIVACY POLICY"
  title: "Privacy Policy"
  description: "This policy explains how we handle and protect personal information when you visit the Yelinktrans website or contact us through the email addresses published here."
  note: "The current website does not offer user registration, online inquiry forms, file uploads, online payments or personalized recommendations."
  tags: ["NOTICE", "SECURITY", "RIGHTS"]

updated: "August 14, 2026"
effective: "The date this website officially launches"

sections:
  - id: "scope"
    title: "1. Scope"
    paragraphs:
      - "This Privacy Policy applies to yelinktrans.com and its Chinese and English pages, operated by Wuxi Yelinktrans Information Technology Co., Ltd. It explains how we handle and protect personal information when you visit the website or contact us through the email addresses published here."
      - "The website primarily presents our services, expertise and working approach. The current version does not offer user registration, online inquiry forms, file uploads, online payments or personalized recommendations."

  - id: "information"
    title: "2. Information We May Process"
    subsections:
      - title: "2.1 Technical information generated when you visit"
        paragraphs:
          - "When you visit the website, hosting, network or security service providers may automatically generate technical records necessary to operate and protect the site, including:"
        bullets:
          - "IP address"
          - "Date and time of access"
          - "Pages visited and referring page"
          - "Browser, device and operating system type"
          - "Page errors and network security event records"
          - "We use this information mainly to keep the website functioning, identify and address security risks, troubleshoot technical issues and comply with applicable legal obligations."
      - title: "2.2 Information you provide by email"
        paragraphs:
          - "When you contact us at James@yelinktrans.com or Mike@yelinktrans.com, we may process information you choose to provide, including:"
        bullets:
          - "Name, company, job title and contact details"
          - "Email address"
          - "Project background, service requirements and communication content"
          - "Files, samples or other materials you voluntarily send"
          - "We use this information to respond to inquiries, understand project requirements, assess the feasibility of working together, prepare proposals or quotations, and support subsequent business and project communication."
          - "Please do not send sensitive personal information that has not been de-identified, complete client data, full files covered by a confidentiality agreement, or information you are not authorized to provide in your first email."

  - id: "cookies"
    title: "3. Cookies and Similar Technologies"
    paragraphs:
      - "The current website does not set marketing cookies or use advertising tracking, user profiling or website behavior analytics tools."
      - "Website hosting, content delivery or security service providers may use technical identifiers necessary to provide access and network security, but we do not use them for personalized advertising."
      - "If we add website analytics, marketing tracking or other non-essential cookies in the future, we will update this policy and provide the explanations and choices required by applicable law."

  - id: "use"
    title: "4. How We Use Information"
    paragraphs:
      - "We use information only to the extent reasonably necessary for the following purposes:"
    bullets:
      - "Present and maintain this website"
      - "Respond to inquiries and discuss project requirements"
      - "Assess service scope, project risks and the feasibility of cooperation"
      - "Prepare proposals, quotations, contracts or project arrangements"
      - "Protect the security of the website, email accounts and related information systems"
      - "Comply with applicable legal obligations or handle disputes"
      - "We do not sell personal information, and we do not use website access or email information for automated decision-making, differential pricing or personalized advertising."

  - id: "sharing"
    title: "5. Service Providers, Sharing and Disclosure"
    paragraphs:
      - "To provide website access and email communication, we may engage providers of website hosting, content delivery, network security, business email, communications and other necessary IT operations to process relevant information."
      - "We require relevant service providers to process information only within the agreed scope and to adopt protections appropriate to the risks involved."
      - "Except in the following circumstances, we do not provide or publicly disclose personal information to unrelated third parties:"
    bullets:
      - "We have obtained your consent"
      - "It is necessary to enter into or perform a contract to which you are a party"
      - "It is necessary to comply with a legal obligation"
      - "It is necessary to protect your or another person's life, health or property"
      - "Other circumstances provided by laws and regulations"
      - "If personal information must be transferred because of a merger, division, restructuring or asset transfer, we will inform you of the recipient as required by law and require the recipient to continue fulfilling the corresponding protection obligations."

  - id: "cross-border"
    title: "6. Cross-Border Processing"
    paragraphs:
      - "Because this website is accessible globally, business email services or certain necessary technical services may use infrastructure located outside mainland China. Some information you provide by email may therefore be transferred across borders or processed overseas."
      - "When such processing occurs, we will take the security measures required by applicable law. Where necessary, we will separately explain the overseas recipient, processing purposes and methods, categories of information and ways to exercise your rights, complete any applicable personal information protection impact assessment, obtain separate consent and satisfy other data-export requirements."

  - id: "retention"
    title: "7. Retention Periods"
    paragraphs:
      - "We retain information only for as long as necessary to achieve the processing purpose:"
    bullets:
      - "Website access and security logs are retained according to website security, troubleshooting and legal requirements. Where applicable law requires network logs to be retained for a specified period, we follow that requirement."
      - "General inquiry emails are retained until the inquiry has been handled and there is no reasonable need for follow-up communication."
      - "If a business relationship is established, relevant emails, contracts, project and financial records are retained as required for contract performance, accounting, taxation, dispute handling and legal compliance."
      - "When the retention period ends, we will delete or anonymize relevant personal information as required by law. Where immediate deletion is not technically possible because of backups or other technical reasons, processing will be limited to storage and security protection."

  - id: "security"
    title: "8. Information Security"
    paragraphs:
      - "We take reasonable administrative and technical measures appropriate to the types of information and risks involved to reduce the risk of unauthorized access, disclosure, alteration, loss or misuse."
      - "If a personal information security incident occurs or may occur, we will take prompt remedial measures and fulfill any reporting and notification obligations under applicable law."
      - "No internet transmission can be guaranteed to be completely secure. Before sending important materials by email, please confirm an appropriate transfer and protection method with us."

  - id: "rights"
    title: "9. Your Rights"
    paragraphs:
      - "Within the scope provided by applicable law, you may request to:"
    bullets:
      - "Access or obtain a copy of your personal information"
      - "Correct or supplement inaccurate or incomplete information"
      - "Delete your personal information"
      - "Restrict or object to certain processing of personal information"
      - "Withdraw consent where processing is based on consent"
      - "Request an explanation of the personal information processing rules"
      - "Raise a complaint or comment concerning personal information protection"
      - "You can contact us at James@yelinktrans.com. To protect information security, we may need to verify your identity before handling a request."

  - id: "minors"
    title: "10. Information About Minors"
    paragraphs:
      - "This website is intended for businesses and professional clients. It is not directed to children under the age of 14, and we do not intentionally collect their personal information."
      - "If we learn that such information was provided without the consent of a parent or guardian, we will delete it or take other necessary measures as required by law."

  - id: "updates"
    title: "11. Policy Updates"
    paragraphs:
      - "We may update this policy as website functions, service methods or applicable laws change."
      - "If an update materially affects how personal information is processed, we will provide an appropriate notice on the website and update the date shown at the top of this policy."

  - id: "contact"
    title: "12. Contact Us"
    paragraphs:
      - "Personal information processor: Wuxi Yelinktrans Information Technology Co., Ltd."
      - "Location: Wuxi, Jiangsu, China"
      - "Email: James@yelinktrans.com; Mike@yelinktrans.com"
