    - "Rather than forcing every project into a standard workflow, we clarify the goals and constraints first, then shape the scope, deliverables and acceptance criteria around what the project actually needs."
  descriptionNoWrapText: "Quality expectations and the right level of human oversight"

services:
  - id: "localization"
    icon: "lucide:languages"
    title: "Multilingual Localization"
    summary: "End-to-end localization for product interfaces, help content, marketing and operations—from translation through language asset maintenance."
    challenge: "Global content is often spread across products, files and versions. As language coverage grows, updates accelerate and formats become more complex, inconsistent terminology, style or workflows can lead to rework, delayed releases and an uneven brand voice."
    scope:
      - "Requirements clarification and project feasibility assessment"
      - "Human translation, review and MTPE"
      - "Creation and maintenance of terminology, style guides and translation memories"
      - "Desktop publishing, format checks and pre-delivery language quality checks"
    evidence: "The core team has supported large multilingual programs in consumer electronics, internet content, cross-border e-commerce and gaming. Historical experience includes individual programs spanning 28 to more than 80 languages, annual volumes reaching tens of millions of source characters and continuous version updates."
    boundary: "Languages, daily throughput and delivery schedules are confirmed for each project. High-risk professional content, including medical and legal material, requires separate confirmation of specialist qualifications and review procedures."

  - id: "ai-solutions"
    icon: "lucide:sparkles"
    title: "AI Solution Design & Implementation"
    summary: "Identify where AI adds value in translation, quality assurance and content workflows, then move the solution from sample validation into practical use."
    challenge: "Using general-purpose AI without a defined framework can lead to terminology drift, context errors and changes that are difficult to trace. Before implementation, organizations need to identify suitable content, quality targets, evaluation methods and the right level of human review."
    scope:
      - "Model and tool selection, evaluation and sample pilots"
      - "AI translation, AI post-editing and human-review workflow design"
      - "Terminology, rules and automated quality-check configuration"
      - "Workflow implementation, quality reporting and continuous improvement"
    evidence: "The core team has participated in AI translation pilots, model evaluation, AI post-editing, automated quality checks and multilingual content-tiering programs, with experience in process design, defining quality targets and human–AI collaboration."
    boundary: "AI output is not automatically ready for publication. The level of human review depends on content risk and quality targets. Without representative samples, terminology or acceptance criteria, we do not promise a fixed percentage improvement in quality."

  - id: "data"
    icon: "lucide:database-zap"
    title: "Multilingual Data Annotation & Collection"
    summary: "Collection, cleansing, annotation, quality sampling and rework closure for multilingual text, image and audio data."
    challenge: "Successful multilingual data programs depend on more than sample volume. Data sources, language and regional distribution, annotation guidelines, quality sampling and version tracking must all be clearly defined, or the reliability of model training and evaluation may suffer."
    scope:
      - "Text, image and audio data collection within mainland China"
      - "Data cleansing, deduplication, named entity recognition and text classification"
      - "Semantic segmentation, object detection, transcription and parallel-corpus processing"
      - "Tool-assisted pre-annotation, human validation, sampling and rework reports"
    evidence: "The core team has participated in cross-border e-commerce annotation, named entity recognition, text classification, sentiment and risk tagging, parallel-corpus processing and data programs related to large language models."
    boundary: "Data collection is currently limited to mainland China. Projects involving personal information, sensitive information, information about minors or restricted data require prior confirmation of lawful sources, authorization and processing methods."

  - id: "testing"
    icon: "lucide:scan-search"
    title: "Multilingual Content Testing & Review"
    summary: "Language quality checks using screenshots, recordings or physical devices, supported by issue logging, fix confirmation and regression testing."
    challenge: "Once content appears in a live interface or on a physical device, problems such as truncation, garbled text, font and layout defects, contextual errors, or missing buttons and resources may emerge. Reviewing the text alone often cannot reveal these in-context issues."
    scope:
      - "Confirmation of test scope, devices, versions and acceptance criteria"
      - "Multilingual LQA using screenshots, recordings or physical devices"
      - "Issue severity, reproduction steps and recommended corrections"
      - "Fix confirmation, regression testing and issue summaries"
    evidence: "The core team has conducted LQA based on screenshots, video and physical devices for consumer electronics, internet content and gaming programs, and has participated in end-to-end test management and quality-metric design."
    boundary: "This service focuses on linguistic, display and text-related issues. It does not replace full functional testing, information security testing, regulatory certification or legal advice for a target market."

