cases:
  eyebrow: "SELECTED EXPERIENCE"
  title: "Practical Solutions, Shaped by Experience."
  items:
    - id: "CASE 01"
      industry: "Consumer Electronics · Internet and Technology"
      title: "Complex Multilingual Content and Smart-Device Delivery"
      profile: "A leading Chinese enterprise in ICT infrastructure, smart devices and artificial intelligence, delivering technology products to markets worldwide."
      scale: "Historical project scale: 80+ languages; 50 million+ source characters per year"
      services: ["Multilingual human translation", "Multilingual AI post-editing", "Screenshot-based LQA", "Text and image annotation"]
      challenge:
        - "Translation quality needed to reflect the brand's positioning and tone."
        - "Multiple products and use cases ran in parallel, making language assets, terminology and versions difficult to manage consistently."
        - "Large recurring volumes required coordination across teams and time zones, increasing the risk of human error."
        - "Errors in high-risk content could cause reputational harm and adverse public attention."
        - "Small-screen devices were vulnerable to truncation and inappropriate abbreviations."
      approach:
        - "Helped establish tiered linguist qualification, resource grouping, ongoing quality monitoring and dynamic level adjustment."
        - "Helped build terminology categories, usage priorities and conflict-resolution rules to improve consistency across use cases."
        - "Mapped the systems, workflows, compliance requirements and data-security needs of both parties, supporting middleware and customized workflow connections that reduced repetitive manual work."
        - "Aligned review effort with defined content-risk levels, using sensitive-term and semantic rules to focus checks on higher-risk content."
        - "Applied length constraints, screenshot mapping and abbreviation rules to identify small-screen truncation risks earlier in the translation process."

    - id: "CASE 02"
      industry: "Consumer Electronics"
      title: "AI-Assisted Translation and Rule-Based Quality Checks"
      profile: "A global consumer electronics and smart-hardware brand expanding smartphones, IoT devices and related products into international markets."
      scale: "Historical project scale: 45+ languages; 10 million+ source characters per year"
      services: ["Multilingual human translation", "Multilingual AI post-editing", "Screenshot-based LQA", "Desktop publishing"]
      challenge:
        - "The client needed to determine where AI was suitable across different types of localization content and where its limits should be set."
        - "Terminology errors, violations of language-specific rules and errors in critical information needed to be reduced while keeping the cost of human review under control."
      approach:
        - "Participated in AI solution consulting, sample evaluation, workflow customization and implementation guidance, defining where AI could be used and how much human review each risk level required."
        - "Built and refined rule sets covering grammatical gender, word stems, antonyms and sensitive terms, combining rule-based tools with LLM-assisted checks and focused human review for high-risk issues."

    - id: "CASE 03"
      industry: "Internet and Technology · Digital Content"
      title: "High-Frequency Content Production and Structured Review Knowledge"
      profile: "A global short-form video and social platform operator managing multilingual online content ecosystems across multiple countries."
      scale: "Historical project scale: 56+ languages; 25 million+ source characters per year"
      services: ["Software and app localization", "Localization of short-form drama, fiction and game content", "Content review for global markets"]
      challenge:
        - "Accelerating content production and release cycles required a workable balance of cost, speed and quality."
        - "Content-review knowledge needed continuous development and a structure that machines could read and apply."
      approach:
        - "Helped organize subtitle production, timing, visual-context translation, AI quality checks and AI dubbing into an orchestrated automation workflow."
        - "Expanded review knowledge from broad categories into a three-level hierarchy and machine-readable structure, adding semantic identification and decision rules beyond lexical matching."

    - id: "CASE 04"
      industry: "Cross-Border E-commerce · Internet and Technology"
      title: "Content-Tiered Cost Control and Data-Annotation Quality Management"
      profile: "A large digital-technology and cross-border e-commerce group operating a global online transaction platform for buyers and sellers."
      scale: "Historical project scale: 72+ languages; 12 million+ source characters per year"
      services: ["Website, software and app localization", "Multiple types of e-commerce data annotation"]
      challenge:
        - "Large content volumes required continuous localization and lower costs without compromising the quality of important content."
        - "Across annotation tasks, guidelines were inconsistent and quality fluctuated over time."
      approach:
        - "Helped establish a matrix combining business value and content risk, assigning different cost levels, quality targets and delivery workflows to each tier."
        - "Used AI tools to classify and route items before annotation, convert subjective quality expectations into checkable indicators and flag potential issues before delivery."
        - "Continuously refined rules and checking tools using post-delivery issue records, creating a closed loop for annotation-quality improvement."

    - id: "CASE 05"
      industry: "Gaming · Internet and Technology"
      title: "Game LQA Quality Standards and Issue Closure"
      profile: "A well-known Chinese internet company with long-term experience developing premium online games for global release and operations."
      scale: "Historical project scale: 28+ languages; 22 million+ source characters per year"
      services: ["Game localization", "Multilingual game LQA"]
      challenge:
        - "Game LQA combines objective defects with subjective judgments about the player experience, making results difficult to measure consistently."
        - "Inconsistent defect categories, severity levels and acceptance criteria could lead to quality fluctuations, disputes and repeated rework."
      approach:
        - "Helped establish subjective and objective game LQA indicators and align defect categories, severity rules and acceptance criteria."
        - "Used issue records, fix confirmation, regression testing and issue summaries to create a closed loop and provide reusable input for later versions."

