approach:
  eyebrow: "WORKING APPROACH"
  title: "贴近业务现场，让语言与AI方案真正落地"
  description: "我们借鉴Forward Deployed Engineering（FDE）的协作思路，从客户实际问题出发，先确认目标与约束，再通过小范围验证降低不确定性，最后进入稳定交付与持续优化。"
  calloutItems: ["语言服务经验", "AI工具与数据能力", "贴近业务的方案咨询"]
  steps:
    - number: "01"
      title: "需求诊断"
      description: "理解内容、流程、质量、时效、成本和数据问题，明确成功标准。"
    - number: "02"
      title: "方案设计"
      description: "组合语言人才、工作流程、AI工具、质量规则和数据方法。"
    - number: "03"
      title: "试点验证"
      description: "用样本试跑验证质量、效率和风险，并据实调整方案。"
    - number: "04"
      title: "交付实施"
      description: "明确角色、节点、交付物和验收标准，推动方案进入真实业务。"
    - number: "05"
      title: "持续优化"
      description: "沉淀术语、规则、问题和回归记录，形成可复用的改进闭环。"

