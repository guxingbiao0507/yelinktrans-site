services:
  eyebrow: "CORE SERVICES"
  title: "围绕企业出海，提供多语言内容、数据标注与AI解决方案"
  mobileTitle: "围绕企业出海，\n提供多语言内容、\n数据标注与AI解决方案"
  description: "结合核心团队16年本地化项目经验，根据内容类型、目标市场和交付要求，匹配合适的语言人才、质量流程与AI工具，让质量、效率和成本更可控。"
