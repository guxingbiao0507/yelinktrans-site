seo:
  title: "隐私政策｜无锡源译"
  description: "了解无锡源译在网站访问和邮件沟通过程中如何处理和保护个人信息。"

hero:
  eyebrow: "PRIVACY POLICY"
  title: "隐私政策"
  description: "本政策说明您访问源译官网或通过网站公布的邮箱联系我们时，我们如何处理和保护相关个人信息。"
  note: "当前网站不提供用户注册、在线留言、文件上传、在线支付或个性化推荐功能。"
  tags: ["NOTICE", "SECURITY", "RIGHTS"]

updated: "2026年8月14日"
effective: "本网站正式上线之日"

sections:
  - id: "scope"
    title: "一、适用范围"
    paragraphs:
      - "本隐私政策适用于由无锡源译信息技术有限公司运营的 yelinktrans.com 及其中文、英文页面，说明我们在您访问本网站或通过网站公布的邮箱联系我们时，如何处理和保护相关个人信息。"
      - "本网站主要用于展示公司服务、行业经验和合作方式。当前版本不提供用户注册、在线留言、文件上传、在线支付或个性化推荐功能。"

  - id: "information"
    title: "二、我们可能处理的信息"
    subsections:
      - title: "1. 网站访问产生的技术信息"
        paragraphs:
          - "当您访问本网站时，网站托管、网络或安全服务可能自动生成必要的技术记录，包括："
        bullets:
          - "IP地址"
          - "访问日期和时间"
          - "访问的页面及来源页面"
          - "浏览器、设备和操作系统类型"
          - "页面错误及网络安全事件记录"
          - "这些信息主要用于保障网站正常运行、识别和处理安全风险、排查技术故障及履行适用的法律义务。"
      - title: "2. 您主动通过邮件提供的信息"
        paragraphs:
          - "当您通过 James@yelinktrans.com 或 Mike@yelinktrans.com 联系我们时，我们可能处理您主动提供的信息，包括："
        bullets:
          - "姓名、公司、职位和联系方式"
          - "电子邮箱地址"
          - "项目背景、服务需求及沟通内容"
          - "您主动发送的文件、样本或其他资料"
          - "这些信息将用于回复咨询、了解项目需求、评估合作可行性、准备方案或报价，以及开展后续商务和项目沟通。"
          - "请不要在首次邮件中直接发送未经脱敏的个人敏感信息、客户数据、受保密协议约束的完整文件，或您无权向我们提供的信息。"

  - id: "cookies"
    title: "三、Cookie及类似技术"
    paragraphs:
      - "本网站当前页面代码不设置营销Cookie，不接入广告追踪、用户画像或网站行为分析工具。"
      - "网站托管、内容分发或安全服务提供商可能使用保障网站正常访问和网络安全所必需的技术标识，但不会由我们用于个性化广告。"
      - "如果未来增加网站分析、营销追踪或其他非必要Cookie，我们将相应更新本政策，并根据适用法律提供必要的说明和选择机制。"

  - id: "use"
    title: "四、我们如何使用相关信息"
    paragraphs:
      - "我们仅在合理、必要的范围内使用相关信息，主要用于："
    bullets:
      - "展示和维护本网站"
      - "回复您的咨询和沟通项目需求"
      - "评估服务范围、项目风险和合作可行性"
      - "准备方案、报价、合同或项目安排"
      - "保障网站、邮箱和相关信息系统安全"
      - "履行适用的法律义务或处理争议"
      - "我们不会出售您的个人信息，也不会利用网站访问或邮件信息进行自动化决策、差别定价或个性化广告推送。"

  - id: "sharing"
    title: "五、委托处理、共享和披露"
    paragraphs:
      - "为了提供网站访问和电子邮件沟通，我们可能委托网站托管、内容分发、网络安全、企业邮箱、通信及必要的信息技术运维服务提供商处理必要信息。"
      - "我们将要求相关服务提供商仅在约定范围内处理信息，并采取与风险相适应的保护措施。"
      - "除以下情况外，我们不会向其他无关第三方提供或公开您的个人信息："
    bullets:
      - "已经取得您的同意"
      - "为订立或履行您作为一方当事人的合同所必需"
      - "为履行法定义务所必需"
      - "为保护您或他人的生命健康、财产安全所必需"
      - "法律法规规定的其他情形"
      - "如果因公司合并、分立、重组或资产转让等原因需要转移相关个人信息，我们将依法告知接收方信息，并要求接收方继续履行相应的保护义务。"

  - id: "cross-border"
    title: "六、跨境处理"
    paragraphs:
      - "由于本网站面向全球访问，企业邮箱或部分必要技术服务可能使用位于中国境外的基础设施。因此，您通过邮件提供的部分信息可能涉及跨境传输或境外处理。"
      - "发生此类处理时，我们将根据适用法律采取必要的安全保护措施，并在需要时另行告知境外接收方、处理目的、处理方式、信息种类以及您行使相关权利的方式，履行适用的个人信息保护影响评估、单独同意及其他数据出境要求。"

  - id: "retention"
    title: "七、信息保存期限"
    paragraphs:
      - "我们仅在实现处理目的所必要的期限内保存相关信息："
    bullets:
      - "网站访问及安全日志按照网站安全、故障排查和法律要求保存；适用法律要求留存网络日志的，按照相应期限执行。"
      - "一般咨询邮件保存至咨询处理完毕且没有合理的后续沟通需要。"
      - "如果双方建立业务合作，相关邮件、合同、项目及财务记录将按照合同履行、会计、税务、争议处理和法律要求保存。"
      - "保存期限届满后，我们将依法删除或匿名化处理相关个人信息；因备份或技术原因无法立即删除的，将停止除存储和安全保护以外的其他处理。"

  - id: "security"
    title: "八、信息安全"
    paragraphs:
      - "我们将根据实际处理的信息类型和风险，采取合理的管理和技术措施，降低个人信息遭到未经授权访问、泄露、篡改、丢失或滥用的风险。"
      - "如果发生或者可能发生个人信息安全事件，我们将及时采取补救措施，并按照适用法律履行报告和通知义务。"
      - "互联网传输无法保证绝对安全。请您在通过邮件发送重要资料前，与我们确认适合的文件传输和保护方式。"

  - id: "rights"
    title: "九、您的权利"
    paragraphs:
      - "在适用法律规定的范围内，您可以请求："
    bullets:
      - "查阅或复制您的个人信息"
      - "更正或补充不准确、不完整的信息"
      - "删除相关个人信息"
      - "限制或拒绝部分个人信息处理"
      - "撤回基于同意开展的个人信息处理"
      - "对个人信息处理规则进行解释说明"
      - "就个人信息保护问题提出投诉或意见"
      - "您可以通过 James@yelinktrans.com 联系我们。为保护信息安全，我们可能需要在处理请求前核实您的身份。"

  - id: "minors"
    title: "十、未成年人信息"
    paragraphs:
      - "本网站面向企业及专业客户，不以不满十四周岁的未成年人为目标用户，我们也不会主动收集不满十四周岁未成年人的个人信息。"
      - "如果我们发现相关信息是在未取得监护人同意的情况下提供的，将依法采取删除或其他必要措施。"

  - id: "updates"
    title: "十一、政策更新"
    paragraphs:
      - "我们可能根据网站功能、服务方式或适用法律的变化更新本政策。"
      - "如果更新对个人信息处理方式产生重要影响，我们将在网站适当位置进行说明，并更新本政策顶部的日期。"

  - id: "contact"
    title: "十二、联系我们"
    paragraphs:
      - "个人信息处理者：无锡源译信息技术有限公司"
      - "所在地：中国·江苏·无锡"
      - "联系邮箱：James@yelinktrans.com；Mike@yelinktrans.com"
