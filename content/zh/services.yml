  eyebrow: "FOCUS INDUSTRIES"
  title: "理解行业差异，才能配置合适的交付方式"
  description: "以下行业在内容形态、发布频率、质量风险和用户场景上各有不同。我们会据此调整术语管理、质量标准、测试方式和AI方案。"
  descriptionNoWrapText: "质量标准、测试方式和AI方案"
  items:
    - icon: "lucide:smartphone"
      title: "消费电子"
      description: "面向手机、智能硬件、可穿戴设备、车载及IoT产品，覆盖界面、帮助、营销等多类型内容以及真实设备中的语言测试。"
    - icon: "lucide:panels-top-left"
      title: "互联网科技"
      description: "面向企业软件、应用、平台及数字内容，支持高频版本、多语同步、术语一致性和内容质量管理。"
    - icon: "lucide:shopping-bag"
      title: "跨境电商"
      description: "面向企业官网、独立站和电商平台的界面、商品及营销内容，兼顾内容规模、商业价值、发布节奏和成本要求。"
    - icon: "lucide:gamepad-2"
      title: "游戏"
      description: "面向游戏版本内文本、运营及营销内容，支持翻译、审校、术语管理、语言质量测试和问题闭环。"

cases:
  eyebrow: "SELECTED EXPERIENCE"
  title: "项目经验，如何转化为解决方法"
  items:
    - id: "CASE 01"
      industry: "消费电子 · 互联网科技"
      title: "复杂多语种内容与智能终端交付"
      profile: "国内领先的ICT基础设施、智能终端与人工智能技术研发企业，面向全球市场开展技术产品落地。"
      scale: "历史项目规模：80+语种，全年5000万+字"
      services: ["多语言人工翻译", "多语言AIPE", "基于截图的LQA", "文本与图像标注"]
      challenge:
        - "翻译质量需要匹配品牌定位和表达调性。"
        - "多个产品和应用场景并行，语料、术语及版本管理复杂。"
        - "大规模日常需求涉及多团队、多时区协同，过程中的人为错误风险较高。"
        - "关键内容翻译错误可能引发负面舆情。"
        - "小屏智能终端容易出现文本截断和不当缩写。"
      approach:
        - "参与建立阶梯式译员准入、人员分层、动态质量监控和等级调整机制。"
        - "参与构建术语分类、使用优先级和冲突处理规则，提高多场景术语管理的一致性。"
        - "梳理双方系统、工作流、合规与数据安全要求，推动中间件及定制流程衔接，减少重复人工操作。"
        - "根据风险内容定义和等级配置审核投入，并结合敏感词及语义规则重点检查高风险内容。"
        - "通过预设长度、截图映射及缩写规则，在翻译阶段提前识别小屏截断风险。"
    - id: "CASE 02"
      industry: "消费电子"
      title: "AI辅助翻译与规则化质量检查"
      profile: "全球化消费电子与智能硬件品牌，持续推进智能手机、IoT设备等产品的海外市场布局。"
      scale: "历史项目规模：45+语种，全年1000万+字"
      services: ["多语言人工翻译", "多语言AIPE", "基于截图的LQA", "桌面排版"]
      challenge:
        - "需要判断AI在不同本地化内容中的适用范围和使用边界。"
        - "需要降低术语、语言规则和关键信息错误，同时控制人工复核成本。"
      approach:
        - "参与AI方案咨询、样本评测、流程定制和落地辅导，根据内容风险确定AI适用范围及人工复核深度。"
        - "持续整理阴阳性、词根、正反词和敏感词等语言规则，并结合规则工具与LLM辅助检查，对高风险问题进行重点拦截和复核。"
    - id: "CASE 03"
      industry: "互联网科技 · 数字内容"
      title: "高频内容生产与审核知识结构化"
      profile: "全球性短视频与社交互联网平台运营商，在多个国家运营多语种线上内容生态。"
      scale: "历史项目规模：56+语种，全年2500万+字"
      services: ["软件与APP本地化", "短剧、小说及游戏内容本地化", "出海内容审核"]
      challenge:
        - "短剧等内容迭代和发布速度持续加快，需要在成本、效率和质量之间建立可执行的平衡。"
        - "内容审核知识需要持续建设，并转化为便于机器读取和调用的结构。"
      approach:
        - "参与梳理字幕制作、打轴、可视化翻译、AI质量检查和AI配音等环节，形成可编排的自动化工作流。"
        - "将审核知识从较粗颗粒度拆分至三级目录并转化为结构化格式，在词汇命中规则之外增加语义识别与判断规则。"
    - id: "CASE 04"
      industry: "跨境电商 · 互联网科技"
      title: "内容分级降本与数据标注质量管理"
      profile: "大型数字科技与跨境电商集团，搭建面向全球买卖双方的跨境线上交易服务体系。"
      scale: "历史项目规模：72+语种，全年1200万+字"
      services: ["网站、软件与APP本地化", "电商场景多类型数据标注"]
      challenge:
        - "大量内容需要持续本地化，降本目标明确，但重要内容的翻译质量不能同步降低。"
        - "多种数据标注任务长期存在口径不一致、质量波动和稳定性不足的问题。"
      approach:
        - "参与建立“内容商业价值×风险等级”矩阵，根据内容等级配置不同成本、质量目标和交付流程。"
        - "借助AI工具对待标注条目进行分类和分流，将主观质量要求转化为可检查指标，并在交付前提示可能的问题。"
        - "结合交付后的问题记录持续迭代规则和检查工具，形成数据标注质量改进闭环。"
    - id: "CASE 05"
      industry: "游戏 · 互联网科技"
      title: "游戏LQA质量标准与问题闭环"
      profile: "国内知名互联网企业，长期从事精品网络游戏研发，多款产品面向全球市场发行运营。"
      scale: "历史项目规模：28+语种，全年2200万+字"
      services: ["游戏本地化翻译", "多语言游戏LQA"]
      challenge:
        - "游戏LQA同时包含客观缺陷和主观体验判断，质量结果较难统一量化。"
        - "缺陷分类、严重度和验收口径不一致，容易造成质量波动、争议和重复返工。"
      approach:
        - "参与建立游戏LQA主观与客观质量指标，统一缺陷分类、严重度规则和验收口径。"
        - "通过问题记录、修复确认、回归复测和问题汇总形成闭环，为后续版本提供可复用依据。"

