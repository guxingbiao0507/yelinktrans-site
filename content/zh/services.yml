seo:
  title: "服务与经验｜多语言内容、数据与AI解决方案｜无锡源译"
  description: "了解无锡源译的多语言本地化翻译、AI解决方案与实施、多语言数据标注与采集、多语言内容测试与审核，以及核心团队匿名历史项目经验。"

hero:
  eyebrow: "SERVICES & EXPERIENCE"
  title: "以专业服务，支持内容与产品走向全球"
  titleLines: ["以专业服务，", "支持内容与产品走向全球"]
  description: "根据内容类型、目标市场、质量风险、交付节奏和预算要求，组合语言人才、质量流程、数据方法与AI工具，形成可执行、可检查的项目方案。"
  note: "具体语种、处理量、排期与响应时间，以项目启动前的资源和范围确认结果为准。"
  tags: ["CONTENT", "DATA", "AI"]

overview:
  eyebrow: "CORE SERVICES"
  title: "从实际问题出发，配置合适的服务组合"
  titleLines: ["从实际问题出发，", "配置合适的服务组合"]
  description: "不同内容和业务阶段需要不同的质量目标与人工投入。我们不会默认套用同一套流程，而是先明确目标和约束，再确定服务范围、交付物及验收方式。"
  descriptionNoWrapText: "质量目标与人工投入"

services:
  - id: "localization"
    icon: "lucide:languages"
    title: "多语言本地化翻译"
    summary: "面向产品界面、帮助、营销及运营等内容，提供从翻译到语言资产维护的完整交付。"
    challenge: "出海内容往往分散在不同产品、文件和版本中。语种多、更新快、格式复杂，如果术语、风格和流程不统一，容易造成返工、发布延误和品牌表达不一致。"
    scope:
      - "需求梳理与项目可行性评估"
      - "人工翻译、审校与MTPE"
      - "术语库、风格指南和翻译记忆库建设与维护"
      - "桌面排版、格式检查与交付前语言质量检查"
    evidence: "核心团队曾参与消费电子、互联网内容、跨境电商和游戏等大型多语种项目，具备28—80+语种、千万级年度内容量及持续版本更新的历史项目管理经验。"
    boundary: "具体语种、日处理量和交付周期需按项目确认；医疗、法律等高风险专业内容需另行确认专家资质和审核流程。"

  - id: "ai-solutions"
    icon: "lucide:sparkles"
    title: "AI解决方案与实施"
    summary: "围绕翻译、质量检查和内容处理流程，评估AI适用范围并推动方案从样本验证走向实际使用。"
    challenge: "直接使用通用AI可能出现术语漂移、上下文误判和修改不可追踪等问题。企业需要先确定适用内容、质量目标、评测方法和人工复核深度。"
    scope:
      - "模型与工具选型、评测和样本试跑"
      - "AI翻译、AIPE及人工复核流程设计"
      - "术语、规则与自动化质量检查配置"
      - "工作流实施、质量报告与持续优化"
    evidence: "核心团队曾参与AI翻译试点、模型评测、AIPE、自动化质量检查及多语言内容分级项目，具备流程设计、质量目标设定和人机协作经验。"
    boundary: "AI输出不直接等同于可发布成品；人工复核深度按内容风险和质量目标确定。在缺少样本、术语或验收标准时，不承诺固定质量提升比例。"

  - id: "data"
    icon: "lucide:database-zap"
    title: "多语言数据标注与采集"
    summary: "提供文本、图像和音频等多语言数据的采集、清洗、标注、抽检和返工闭环。"
    challenge: "多语言数据项目不仅需要足够样本，还要解决数据来源、语言与地域分布、标注口径、质量抽检和版本追踪等问题。任何一环不清晰，都可能影响模型训练或评测。"
    scope:
      - "中国境内的文本、图像和音频数据采集"
      - "数据清洗、去重、实体识别和文本分类"
      - "语义分割、目标检测、语音转写和平行语料处理"
      - "工具辅助预标注、人工校验、抽检与返工报告"
    evidence: "核心团队曾参与跨境电商内容标注、实体识别、文本分类、情感与风险标签、平行语料及大模型相关数据项目。"
    boundary: "数据采集当前仅限中国境内。涉及个人信息、敏感信息、未成年人或受限数据时，需先确认合法来源、授权和处理方式。"

  - id: "testing"
    icon: "lucide:scan-search"
    title: "多语言内容测试与审核"
    summary: "通过截图、录屏或真机开展语言质量检查，支持问题记录、修复确认和回归复测。"
    challenge: "内容进入真实界面或设备后，可能出现截断、乱码、字体与排版异常、上下文不符、按钮或资源缺失等问题。单看译文通常无法发现这些发布场景中的缺陷。"
    scope:
      - "测试范围、设备、版本和验收口径确认"
      - "基于截图、录屏或真机的多语言LQA"
      - "问题严重度、复现路径和修改建议记录"
      - "修复确认、回归复测和问题汇总"
    evidence: "核心团队曾在消费电子、互联网内容和游戏项目中开展截图、视频及真机LQA，并参与测试全流程管理与质量指标设计。"
    boundary: "服务以语言、显示和与文本相关的问题为主，不替代完整功能测试、信息安全测试、监管认证或目标市场法律意见。"

