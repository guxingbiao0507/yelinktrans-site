数据标注与AI解决方案</span><!--]--></h2><p><!--[-->结合核心团队16年本地化项目经验，根据内容类型、目标市场和交付要求，匹配合适的语言人才、质量流程与AI工具，让质量、效率和成本更可控。<!--]--></p></div><div class="service-grid"><!--[--><article class="service-card"><div class="card-topline"><span class="icon-box"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m5 8l6 6m-7 0l6-6l2-3M2 5h12M7 2h1m14 20l-5-10l-5 10m2-4h6"/></svg></span><span class="card-index">01</span></div><h3>多语言本地化翻译</h3><p>面向产品界面、帮助、营销及运营等内容，提供翻译、审校、术语与风格管理、桌面排版及语言资产维护。</p><a href="/services#localization" class="text-link">了解服务详情 <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7-7l7 7l-7 7"/></svg></a></article><article class="service-card"><div class="card-topline"><span class="icon-box"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594zM20 2v4m2-2h-4"/><circle cx="4" cy="20" r="2"/></g></svg></span><span class="card-index">02</span></div><h3>AI解决方案与实施</h3><p>围绕翻译、质量检查和内容处理流程，提供模型与工具评测、样本试跑、AI翻译、AIPE、自动化质量检查及工作流实施。</p><a href="/services#ai-solutions" class="text-link">了解服务详情 <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7-7l7 7l-7 7"/></svg></a></article><article class="service-card"><div class="card-topline"><span class="icon-box"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 12 2.84M21 5v3m0 4l-3 5h4l-3 5"/><path d="M3 12a9 3 0 0 0 11.59 2.87"/></g></svg></span><span class="card-index">03</span></div><h3>多语言数据标注与采集</h3><p>提供文本、图像和音频等多语言数据标注，包括数据清洗、分类、实体识别、语音转写和平行语料处理，并按项目需要开展中国境内数据采集。</p><a href="/services#data" class="text-link">了解服务详情 <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7-7l7 7l-7 7"/></svg></a></article><article class="service-card"><div class="card-topline"><span class="icon-box"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="m16 16l-1.9-1.9"/></g></svg>< 0 17 2H7a2 2 0 0 0-1.6.8z"/></g></svg><span class="industry-orbit"></span></div><div class="industry-copy"><h3>跨境电商</h3><p>面向企业官网、独立站和电商平台的界面、商品及营销内容，提供多语言本地化翻译、数据标注、内容测试与审核，并根据项目需要配置AI解决方案。</p></div></article><article class="industry-card"><div class="industry-visual" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 11h4M8 9v4m7-1h.01M18 10h.01m-.69-5H6.68a4 4 0 0 0-3.978 3.59l-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258q-.01-.075-.017-.151A4 4 0 0 0 17.32 5"/></svg><span class="industry-orbit"></span></div><div class="industry-copy"><h3>游戏</h3><p>面向游戏版本内文本、运营及营销内容，提供多语言本地化翻译、术语与质量管理、内容测试与审核，并根据项目需要配置AI解决方案。</p></div></article><!--]--></div></div></section><section class="section section-approach" aria-labelledby="approach-title"><span id="approach" class="section-anchor" aria-hidden="true"></span><div class="container approach-grid"><div class="approach-copy"><p class="eyebrow eyebrow-light">WORKING APPROACH</p><h2 id="approach-title">贴近业务现场，让语言与AI方案真正落地</h2><p>我们借鉴Forward Deployed Engineering（FDE）的协作思路，从客户实际问题出发，先确认目标与约束，再通过小范围验证降低不确定性，最后进入稳定交付与持续优化。</p><div class="approach-callout"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="9" cy="9" r="7"/><circle cx="15" cy="15" r="7"/></g></svg><!--[--><!--[--><!----><span>语言服务经验</span><!--]--><!--[--><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide approach-plus" style="" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7-7v14"/></svg><span>AI工具与数据能力</span><!--]--><!--[--><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide approach-plus" style="" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7-7v14"/></svg><span>贴近业务的方案咨询</span><!--]--><!--]--></div></div><ol class="step-list"><!--[--><li><span class="step-number">01</span><div><h3>需求诊断</h3><p>理解内容、流程、质量、时效、成本和数据问题，明确成功标准。</p></div></li><li><span class="step-number">02</span><div><h3>方案设计</h3><p>组合语言人才、工作流程、AI工具、质量规则和数据方法。</p></div></li><li><span class="step-number">03</span><div><h3>试点验证</h3><p>用样本试跑验证质量、效率和风险，并据实调整方案。</p></div></li><li><span class="step-number">04</span><div><h3>交付实施</h3><p>明确角色、节点、交付物和验收标准，推动方案进入真实业务。</p></div></li><li><span class="step-number">05</span><div><h3>持续优化</h3><p>沉淀术语、规则、问题和回归记录，形成可复用的改进闭环。</p></div></li><!--]--></ol></div></section><section class="section section-trust" aria-labelledby="trust-title"><span id="about" class="section-anchor" aria-hidden="true"></span><div class="container trust-grid"><div class="trust-heading"><p class="eyebrow">WHY YELINKTRANS</p><h2 id="trust-title">专业经验，
落实到每一次交付</h2><p>我们把行业经验转化为清晰的项目规则、可追踪的交付过程和可验证的质量结果。</p></div><div class="trust-list"><!--[--><article><span class="icon-box icon-box-soft"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9a9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5m4-1v5l4 2"/></g></svg></span><div><h3>核心团队16年行业经验</h3><p>核心团队长期参与大型、复杂、多语种项目，熟悉不同内容类型、质量风险和交付节奏。</p></div></article><article><span class="icon-box icon-box-soft"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="9" cy="9" r="7"/><circle cx="15" cy="15" r="7"/></g></svg></span><div><h3>懂语言，也理解业务</h3><p>从内容、流程、质量、时效、成本和数据需求出发设计方案，让语言与技术能力贴近实际业务目标。</p></div></article><article><span class="icon-box icon-box-soft"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></g></svg></span><div><h3>项目过程透明可追踪</h3><p>项目启动前明确服务范围、角色、交付物、质量标准、时间节点和变更方式，关键过程与结果有据可查。</p></div></article><article><span class="icon-box icon-box-soft"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M2 21a8 8 0 0 1 13.292-6"/><circle cx="10" cy="8" r="5"/><path d="m16 19l2 2l4-4"/></g></svg></span><div><h3>核心成员把控关键节点</h3><p>核心成员参与重要需求沟通、方案设计和质量节点，确保承诺与实际交付保持一致。</p></div></article><article><span class="icon-box icon-box-soft"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"/><path d="M14 2v4a2 2 0 0 0 2 2h4M3 15l2 2l4-4"/></g></svg></span><div><h3>质量问题闭环管理</h3><p>通过术语、规则、抽检、LQA、问题记录和回归复测，推动问题识别、修复、确认和持续改进。</p></div></article><!--]--></div></div></section><section class="section section-contact" aria-labelledby="contact-title"><span id="contact" class="section-anchor" aria-hidden="true"></span><div class="contact-card container"><div><p class="eyebrow eyebrow-light">START A CONVERSATION</p><h2 id="contact-title">联系合作</h2><p>请简要告知语种、内容类型、项目规模和时间要求，我们会尽快评估并回复。</p></div><div class="contact-actions"><a class="button button-light" href="mailto:James@yelinktrans.com?subject=官网项目咨询"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11zm7.318-19.539l-10.94 10.939"/></svg> 邮件联系我们</a></div></div></section></main><footer class="site-footer"><div class="container footer-grid"><div class="footer-brand"><a aria-current="page" href="/" class="router-link-active router-link-exact-active wordmark wordmark-footer" ari Color" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/></g></svg> 具体语种、处理量、排期与响应时间，以项目启动前的资源和范围确认结果为准。</p></div><div class="page-hero-graphic reveal reveal-2" aria-hidden="true"><span class="page-hero-mesh"></span><span class="page-hero-orbit orbit-a"></span><span class="page-hero-orbit orbit-b"></span><span class="page-hero-connector connector-1"></span><span class="page-hero-connector connector-2"></span><span class="page-hero-connector connector-3"></span><span class="page-hero-core"><strong>Y</strong><small>YELINKTRANS</small></span><!--[--><span class="page-hero-tag-1 page-hero-tag"><small>01</small><strong>CONTENT</strong></span><span class="page-hero-tag-2 page-hero-tag"><small>02</small><strong>DATA</strong></span><span class="page-hero-tag-3 page-hero-tag"><small>03</small><strong>AI</strong></span><!--]--><span class="page-hero-graphic-caption">LANGUAGE × AI OPERATIONS</span></div></div></section><section class="section detail-section" aria-labelledby="service-overview-title"><div class="container"><div class="section-intro section-intro-center"><p class="eyebrow">CORE SERVICES</p><h2 id="service-overview-title"><!--[--><span class="section-title-line">从实际问题出发，</span><span class="section-title-line">配置合适的服务组合</span><!--]--></h2><p><!--[-->不同内容和业务阶段需要不同的<span class="no-wrap-phrase">质量目标与人工投入</span>。我们不会默认套用同一套流程，而是先明确目标和约束，再确定服务范围、交付物及验收方式。<!--]--></p></div><div class="service-detail-grid"><!--[--><div class="service-detail-row"><!--[--><article id="localization" class="service-detail-card"><div class="detail-card-heading"><span class="icon-box"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m5 8l6 6m-7 0l6-6l2-3M2 5h12M7 2h1m14 20l-5-10l-5 10m2-4h6"/></svg></span><span class="detail-index">01</span></div><h2>多语言本地化翻译</h2><p class="detail-summary">面向产品界面、帮助、营销及运营等内容，提供从翻译到语言资产维护的完整交付。</p><div class="detail-block detail-block-challenge"><h3>客户常见问题</h3><p>出海内容往往分散在不同产品、文件和版本中。语种多、更新快、格式复杂，如果术语、风格和流程不统一，容易造成返工、发布延误和品牌表达不一致。</p></div><div class="detail-block detail-block-scope"><h3>服务范围</h3><ul class="check-list"><!--[--><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>需求梳理与项目可行性评估</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>人工翻译、审校与MTPE</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>术语库、风格指南和翻译记忆库建设与维护</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>桌面排版、格式检查与交付前语言质量检查</span></li><!--]--></ul></div><div class="experience-note"><strong>相关经验</strong><p>核心团队曾参与消费电子、互联网内容、跨境电商和游戏等大型多语种项目，具备28—80+语种、千万级年度内容量及持续版本更新的历史项目管理经验。</p></div><div class="boundary-note"><strong>服务边界</strong><p>具体语种、日处理量和交付周期需按项目确认；医疗、法律等高风险专业内容需另行确认专家资质和审核流程。</p></div></article><article id="ai-solutions" class="service-detail-card"><div class="detail-card-heading"><span class="icon-box"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594zM20 2v4m2-2h-4"/><circle cx="4" cy="20" r="2"/></g></svg></span><span class="detail-index">02</span></div><h2>AI解决方案与实施</h2><p class="detail-summary">围绕翻译、质量检查和内容处理流程，评估AI适用范围并推动方案从样本验证走向实际使用。</p><div class="detail-block detail-block-challenge"><h3>客户常见问题</h3><p>直接使用通用AI可能出现术语漂移、上下文误判和修改不可追踪等问题。企业需要先确定适用内容、质量目标、评测方法和人工复核深度。</p></div><div class="detail-block detail-block-scope"><h3>服务范围</h3><ul class="check-list"><!--[--><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>模型与工具选型、评测和样本试跑</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>AI翻译、AIPE及人工复核流程设计</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>术语、规则与自动化质量检查配置</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>工作流实施、质量报告与持续优化</span></li><!--]--></ul></div><div class="experience-note"><strong>相关经验</strong><p>核心团队曾参与AI翻译试点、模型评测、AIPE、自动化质量检查及多语言内容分级项目，具备流程设计、质量目标设定和人机协作经验。</p></div><div class="boundary-note"><strong>服务边界</strong><p>AI输出不直接等同于可发布成品；人工复核深度按内容风险和质量目标确定。在缺少样本、术语或验收标准时，不承诺固定质量提升比例。</p></div></article><!--]--></div><div class="service-detail-row"><!--[--><article id="data" class="service-detail-card"><div class="detail-card-heading"><span class="icon-box"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 12 2.84M21 5v3m0 4l-3 5h4l-3 5"/><path d="M3 12a9 3 0 0 0 11.59 2.87"/></g></svg></span><span class="detail-index">03</span></div><h2>多语言数据标注与采集</h2><p class="detail-summary">提供文本、图像和音频等多语言数据的采集、清洗、标注、抽检和返工闭环。</p><div class="detail-block detail-block-challenge"><h3>客户常见问题</h3><p>多语言数据项目不仅需要足够样本，还要解决数据来源、语言与地域分布、标注口径、质量抽检和版本追踪等问题。任何一环不清晰，都可能影响模型训练或评测。</p></div><div class="detail-block detail-block-scope"><h3>服务范围</h3><ul class="check-list"><!--[--><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>中国境内的文本、图像和音频数据采集</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>数据清洗、去重、实体识别和文本分类</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>语义分割、目标检测、语音转写和平行语料处理</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>工具辅助预标注、人工校验、抽检与返工报告</span></li><!--]--></ul></div><div class="experience-note"><strong>相关经验</strong><p>核心团队曾参与跨境电商内容标注、实体识别、文本分类、情感与风险标签、平行语料及大模型相关数据项目。</p></div><div class="boundary-note"><strong>服务边界</strong><p>数据采集当前仅限中国境内。涉及个人信息、敏感信息、未成年人或受限数据时，需先确认合法来源、授权和处理方式。</p></div></article><article id="testing" class="service-detail-card"><div class="detail-card-heading"><span class="icon-box"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="m16 16l-1.9-1.9"/></g></svg></span><span class="detail-index">04</span></div><h2>多语言内容测试与审核</h2><p class="detail-summary">通过截图、录屏或真机开展语言质量检查，支持问题记录、修复确认和回归复测。</p><div class="detail-block detail-block-challenge"><h3>客户常见问题</h3><p>内容进入真实界面或设备后，可能出现截断、乱码、字体与排版异常、上下文不符、按钮或资源缺失等问题。单看译文通常无法发现这些发布场景中的缺陷。</p></div><div class="detail-block detail-block-scope"><h3>服务范围</h3><ul class="check-list"><!--[--><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>测试范围、设备、版本和验收口径确认</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>基于截图、录屏或真机的多语言LQA</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>问题严重度、复现路径和修改建议记录</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>修复确认、回归复测和问题汇总</span></li><!--]--></ul></div><div class="experience-note"><strong>相关经验</strong><p>核心团队曾在消费电子、互联网内容和游戏项目中开展截图、视频及真机LQA，并参与测试全流程管理与质量指标设计。</p></div><div class="boundary-note"><strong>服务边界</strong><p>服务以语言、显示和与文本相关的问题为主，不替代完整功能测试、信息安全测试、监管认证或目标市场法律意见。</p></div></article><!--]--></div><!--]--></div></div></section><section class="section industry-detail-section" aria-labelledby="industry-detail-title"><div class="container"><div class="section-intro section-intro-left"><p class="eyebrow">FOCUS INDUSTRIES</p><h2 id="industry-detail-title"><!--[--><span class="">理解行业差异，才能配置合适的交付方式</span><!----><!--]--></h2><p><!--[-->以下行业在内容形态、发布频率、质量风险和用户场景上各有不同。我们会据此调整术语管理、<span class="no-wrap-phrase">质量标准、测试方式和AI方案</span>。<!--]--></p></div><div class="industry-summary-grid"><!--[--><article><span class="icon-box icon-box-soft"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></g></svg></span><h3>消费电子</h3><p>面向手机、智能硬件、可穿戴设备、车载及IoT产品，覆盖界面、帮助、营销等多类型内容以及真实设备中的语言测试。</p></article><article><span class="icon-box icon-box-soft"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M9 21V9"/></g></svg></span><h3>互联网科技</h3><p>面向企业软件、应用、平台及数字内容，支持高频版本、多语同步、术语一致性和内容质量管理。</p></article><article><span class="icon-box icon-box-soft"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M16 10a4 4 0 0 1-8 0M3.103 6.034h17.794"/><path d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"/></g></svg></span><h3>跨境电商</h3><p>面向企业官网、独立站和电商平台的界面、商品及营销内容，兼顾内容规模、商业价值、发布节奏和成本要求。</p></article><article><span class="icon-box icon-box-soft"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 11h4M8 9v4m7-1h.01M18 10h.01m-.69-5H6.68a4 4 0 0 0-3.978 3.59l-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258q-.01-.075-.017-.151A4 4 0 0 0 17.32 5"/></svg></span><h3>游戏</h3><p>面向游戏版本内文本、运营及营销内容，支持翻译、审校、术语管理、语言质量测试和问题闭环。</p></article><!--]--></div></div></section><section id="cases" class="section cases-section" aria-labelledby="cases-title"><div class="container"><div class="section-intro section-intro-left"><p class="eyebrow">SELECTED EXPERIENCE</p><h2 id="cases-title"><!--[--><span class="">项目经验，如何转化为解决方法</span><!----><!--]--></h2><!----></div><div class="case-list"><!--[--><article class="case-card"><div class="case-meta"><span>CASE 01</span><span>消费电子 · 互联网科技</span><span>核心团队历史经验</span></div><div class="case-main"><div class="case-heading"><h3>复杂多语种内容与智能终端交付</h3><p>国内领先的ICT基础设施、智能终端与人工智能技术研发企业，面向全球市场开展技术产品落地。</p><strong>历史项目规模：80+语种，全年5000万+字</strong><div class="case-services"><h4>项目范围</h4><ul class="case-service-list"><!--[--><li>多语言人工翻译</li><li>多语言AIPE</li><li>基于截图的LQA</li><li>文本与图像标注</li><!--]--></ul></div></div><div class="case-content"><div><h4>项目问题</h4><ul class="case-bullet-list"><!--[--><li>翻译质量需要匹配品牌定位和表达调性。</li><li>多个产品和应用场景并行，语料、术语及版本管理复杂。</li><li>大规模日常需求涉及多团队、多时区协同，过程中的人为错误风险较高。</li><li>关键内容翻译错误可能引发负面舆情。</li><li>小屏智能终端容易出现文本截断和不当缩写。</li><!--]--></ul></div><div><h4>处理方法</h4><ul class="case-bullet-list"><!--[--><li>参与建立阶梯式译员准入、人员分层、动态质量监控和等级调整机制。</li><li>参与构建术语分类、使用优先级和冲突处理规则，提高多场景术语管理的一致性。</li><li>梳理双方系统、工作流、合规与数据安全要求，推动中间件及定制流程衔接，减少重复人工操作。</li><li>根据风险内容定义和等级配置审核投入，并结合敏感词及语义规则重点检查高风险内容。</li><li>通过预设长度、截图映射及缩写规则，在翻译阶段提前识别小屏截断风险。</li><!--]--></ul></div></div></div></article><article class="case-card"><div class="case-meta"><span>CASE 02</span><span>消费电子</span><span>核心团队历史经验</span></div><div class="case-main"><div class="case-heading"><h3>AI辅助翻译与规则化质量检查</h3><p>全球化消费电子与智能硬件品牌，持续推进智能手机、IoT设备等产品的海外市场布局。</p><strong>历史项目规模：45+语种，全年1000万+字</strong><div class="case-services"><h4>项目范围</h4><ul class="case-service-list"><!--[--><li>多语言人工翻译</li><li>多语言AIPE</li><li>基于截图的LQA</li><li>桌面排版</li><!--]--></ul></div></div><div class="case-content"><div><h4>项目问题</h4><ul class="case-bullet-list"><!--[--><li>需要判断AI在不同本地化内容中的适用范围和使用边界。</li><li>需要降低术语、语言规则和关键信息错误，同时控制人工复核成本。</li><!--]--></ul></div><div><h4>处理方法</h4><ul class="case-bullet-list"><!--[--><li>参与AI方案咨询、样本评测、流程定制和落地辅导，根据内容风险确定AI适用范围及人工复核深度。</li><li>持续整理阴阳性、词根、正反词和敏感词等语言规则，并结合规则工具与LLM辅助检查，对高风险问题进行重点拦截和复核。</li><!--]--></ul></div></div></div></article><article class="case-card"><div class="case-meta"><span>CASE 03</span><span>互联网科技 · 数字内容</span><span>核心团队历史经验</span></div><div class="case-main"><div class="case-heading"><h3>高频内容生产与审核知识结构化</h3><p>全球性短视频与社交互联网平台运营商，在多个国家运营多语种线上内容生态。</p><strong>历史项目规模：56+语种，全年2500万+字</strong><div class="case-services"><h4>项目范围</h4><ul class="case-service-list"><!--[--><li>软件与APP本地化</li><li>短剧、小说及游戏内容本地化</li><li>出海内容审核</li><!--]--></ul></div></div><div class="case-content"><div><h4>项目问题</h4><ul class="case-bullet-list"><!--[--><li>短剧等内容迭代和发布速度持续加快，需要在成本、效率和质量之间建立可执行的平衡。</li><li>内容审核知识需要持续建设，并转化为便于机器读取和调用的结构。</li><!--]--></ul></div><div><h4>处理方法</h4><ul class="case-bullet-list"><!--[--><li>参与梳理字幕制作、打轴、可视化翻译、AI质量检查和AI配音等环节，形成可编排的自动化工作流。</li><li>将审核知识从较粗颗粒度拆分至三级目录并转化为结构化格式，在词汇命中规则之外增加语义识别与判断规则。</li><!--]--></ul></div></div></div></article><article class="case-card"><div class="case-meta"><span>CASE 04</span><span>跨境电商 · 互联网科技</span><span>核心团队历史经验</span></div><div class="case-main"><div class="case-heading"><h3>内容分级降本与数据标注质量管理</h3><p>大型数字科技与跨境电商集团，搭建面向全球买卖双方的跨境线上交易服务体系。</p><strong>历史项目规模：72+语种，全年1200万+字</strong><div class="case-services"><h4>项目范围</h4><ul class="case-service-list"><!--[--><li>网站、软件与APP本地化</li><li>电商场景多类型数据标注</li><!--]--></ul></div></div><div class="case-content"><div><h4>项目问题</h4><ul class="case-bullet-list"><!--[--><li>大量内容需要持续本地化，降本目标明确，但重要内容的翻译质量不能同步降低。</li><li>多种数据标注任务长期存在口径不一致、质量波动和稳定性不足的问题。</li><!--]--></ul></div><div><h4>处理方法</h4><ul class="case-bullet-list"><!--[--><li>参与建立“内容商业价值×风险等级”矩阵，根据内容等级配置不同成本、质量目标和交付流程。</li><li>借助AI工具对待标注条目进行分类和分流，将主观质量要求转化为可检查指标，并在交付前提示可能的问题。</li><li>结合交付后的问题记录持续迭代规则和检查工具，形成数据标注质量改进闭环。</li><!--]--></ul></div></div></div></article><article class="case-card"><div class="case-meta"><span>CASE 05</span><span>游戏 · 互联网科技</span><span>核心团队历史经验</span></div><div class="case-main"><div class="case-heading"><h3>游戏LQA质量标准与问题闭环</h3><p>国内知名互联网企业，长期从事精品网络游戏研发，多款产品面向全球市场发行运营。</p><strong>历史项目规模：28+语种，全年2200万+字</strong><div class="case-services"><h4>项目范围</h4><ul class="case-service-list"><!--[--><li>游戏本地化翻译</li><li>多语言游戏LQA</li><!--]--></ul></div></div><div class="case-content"><div><h4>项目问题</h4><ul class="case-bullet-list"><!--[--><li>游戏LQA同时包含客观缺陷和主观体验判断，质量结果较难统一量化。</li><li>缺陷分类、严重度和验收口径不一致，容易造成质量波动、争议和重复返工。</li><!--]--></ul></div><div><h4>处理方法</h4><ul class="case-bullet-list"><!--[--><li>参与建立游戏LQA主观与客观质量指标，统一缺陷分类、严重度规则和验收口径。</li><li>通过问题记录、修复确认、回归复测和问题汇总形成闭环，为后续版本提供可复用依据。</li><!--]--></ul></div></div></div></article><!--]--></div></div></section><section class="section section-contact" aria-label="联系合作"><div class="contact-card container"><div><p class="eyebrow eyebrow-light">START WITH THE REQUIREMENT</p><h2>需求沟通</h2><p>请简要说明业务场景、目标语种、内容或数据类型、规模和时间要求，我们会据此判断适合的下一步。</p></div><div class="contact-actions"><a href="/contact" class="button button-light"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h10v10M7 17L17 7"/></svg> 联系合作</a><a href="/approach" class="button button-outline-light">了解协作方式</a></div></div></section></main><footer class="site-footer"><div class="container footer-grid"><div class="footer-brand"><a href="/" class="wordmark wordmark-footer" aria-label="返回首页"><span class="wordmark-symbol" aria-hidden="true"><span>Y</span></span><span class="wordmark-copy"><strong>源译</strong><small>YELINKTRANS</small></span></a><p>专注中国企业出海所需的多语言内容、数据与AI解决方案。</p></div><div><h2>快速导航</h2><!--[--><a href="/" class="">首页</a><a aria-current="page" href="/services" class="router-link-active router-link-exact-active">服务与经验</a><a href="/approach" class="">协作方式</a><a href="/#about" class="">关于我们</a><a href="/contact" class="">联系合作</a><a href="/privacy" class="">隐私政策</a><!--]--></div><div><h2>联系</h2><p class="footer-contact-line"><a href="mailto:James@yelinktrans.com">James@yelinktrans.com</a><span>或</span><a href="mailto:Mike@yelinktrans.com">Mike@yelinktrans.com</a></p><p>中国·江苏·无锡</p></div></div><div class="container footer-bottom"><p>© 2026 Wuxi Yelinktrans Information Technology Co., Ltd. All rights reserved.</p><a href="/privacy" class="">隐私政策</a></div></footer></div></template>
  <template id="review-approach"><div class="site-shell"><header class="site-header"><a class="skip-link" href="#main-content">跳至主要内容</a><div class="header-inner container"><a href="/" class="wordmark" aria-label="无锡源译首页"><span class="wordmark-symbol" aria-hidden="true"><span>Y</span></span><span class="wordmark-copy"><strong>源译</strong><small>YELINKTRANS</small></span></a><nav id="primary-navigation" class="primary-nav" aria-label="主导航"><!--[--><a href="/" class="">首页</a><a href="/services" class="">服务与经验</a><a aria-current="page" href="/approach" class="router-link-active router-link-exact-active is-current">协作方式</a><a href="/#about" class="">关于我们</a><!--]--><a href="/en/approach" class="language-link" aria-label="切换至英文">EN</a><a href="/contact" class="button button-primary header-cta">联系我们</a></nav><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="打开菜单"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5h16M4 12h16M4 19h16"/></svg></button></div></header><main id="main-content"><section class="page-hero" aria-labelledby="page-title"><div class="container page-hero-grid"><div class="page-hero-copy reveal reveal-1"><p class="eyebrow">WORKING APPROACH</p><h1 id="page-title"><!--[--><span class="page-hero-title-line">从问题出发，</span><span class="page-hero-title-line">让方案真正落地</span><!--]--></h1><p class="page-hero-description">我们借鉴Forward Deployed Engineering（FDE）的协作思路，从客户的实际问题和约束出发，通过需求诊断、方案设计和小范围验证，降低不确定性，再进入稳定交付与持续优化。</p><p class="page-hero-note"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/></g></svg> FDE在这里代表一种贴近实际业务问题的协作方法，不等同于长期驻场，也不表示我们提供所有类型的软件开发服务。</p></div><div class="page-hero-graphic reveal reveal-2" aria-hidden="true"><span class="page-hero-mesh"></span><span class="page-hero-orbit orbit-a"></span><span class="page-hero-orbit orbit-b"></span><span class="page-hero-connector connector-1"></span><span class="page-hero-connector connector-2"></span><span class="page-hero-connector connector-3"></span><span class="page-hero-core"><strong>Y</strong><small>YELINKTRANS</small></span><!--[--><span class="page-hero-tag-1 page-hero-tag"><small>01</small><strong>DIAGNOSE</strong></span><span class="page-hero-tag-2 page-hero-tag"><small>02</small><strong>VALIDATE</strong></span><span class="page-hero-tag-3 page-hero-tag"><small>03</small><strong>DELIVER</strong></span><!--]--><span class="page-hero-graphic-caption">LANGUAGE × AI OPERATIONS</span></div></div></section><section class="section approach-intro-section" aria-labelledby="approach-intro-title"><div class="container approach-intro-grid"><div><p class="eyebrow">WHY THIS APPROACH</p><h2 id="approach-intro-title">先理解问题，再决定使用什么服务和工具</h2></div><div class="approach-intro-copy"><!--[--><p>多语言项目的问题通常并不只来自翻译。内容类型、发布节奏、质量标准、供应商协作、数据结构和技术工具，都会影响最终结果。</p><p>因此，我们不会一开始就把某个模型、工具或固定流程作为答案，而是先明确客户希望改善什么、哪些条件不能改变，以及什么结果可以被验证。</p><!--]--><div class="approach-formula"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="9" cy="9" r="7"/><circle cx="15" cy="15" r="7"/></g></svg> 语言服务经验＋AI工具与数据能力＋贴近业务的方案咨询</div></div></div></section><section class="section process-section" aria-labelledby="process-title"><div class="container"><div class="section-intro section-intro-left"><p class="eyebrow">FIVE-STAGE PROCESS</p><h2 id="process-title"><!--[--><span class="">五个阶段，把复杂问题转化为可执行安排</span><!----><!--]--></h2><p><!--[-->每个阶段都形成明确的判断或交付物。项目可根据实际情况从其中某一阶段开始，也可以先完成小范围试点。<!--]--></p></div><ol class="process-list"><!--[--><li><div class="process-number">01</div><div class="process-icon"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g></svg></div><div class="process-copy"><h3>需求诊断</h3><p>了解业务目标、内容或数据类型、现有流程、质量问题、时间要求、预算约束和技术环境，确认真正需要解决的问题。</p></div><div class="process-outputs"><!--[--><span>需求与问题清单</span><span>成功标准</span><span>范围和约束</span><!--]--></div></li><li><div class="process-number">02</div><div class="process-icon"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2m4 7h4m-4 5h4m-8-5h.01M8 16h.01"/></g></svg></div><div class="process-copy"><h3>方案设计</h3><p>组合语言人才、工作流程、AI工具、质量规则和数据方法，明确角色、交付物、质量目标、变更方式和验收口径。</p></div><div class="process-outputs"><!--[--><span>服务与流程方案</span><span>角色与责任</span><span>质量和验收标准</span><!--]--></div></li><li><div class="process-number">03</div><div class="process-icon"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2M6.453 15h11.094M8.5 2h7"/></svg></div><div class="process-copy"><h3>试点验证</h3><p>选择具有代表性的样本或小范围任务，验证质量、效率、成本和风险，记录问题并据实调整方案。</p></div><div class="process-outputs"><!--[--><span>试点样本与结果</span><span>问题和风险记录</span><span>调整建议</span><!--]--></div></li><li><div class="process-number">04</div><div class="process-icon"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09"/><path d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05"/></g></svg></div><div class="process-copy"><h3>交付实施</h3><p>按照确认后的范围和流程进入实际项目，管理人员、时间节点、质量检查、问题升级和变更，确保方案能够持续执行。</p></div><div class="process-outputs"><!--[--><span>项目计划</span><span>阶段性交付</span><span>质量与进度记录</span><!--]--></div></li><li><div class="process-number">05</div><div class="process-icon"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9a9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5m5 4a9 9 0 0 1-9 9a9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g></svg></div><div class="process-copy"><h3>持续优化</h3><p>复盘交付数据和问题记录，沉淀术语、规则、样本及回归结果，逐步改善质量、效率和协作方式。</p></div><div class="process-outputs"><!--[--><span>复盘与改进项</span><span>语言和质量资产</span><span>后续优化计划</span><!--]--></div></li><!--]--></ol></div></section><section class="section scenarios-section" aria-labelledby="scenarios-title"><div class="container"><div class="section-intro section-intro-center"><p class="eyebrow">WHEN IT FITS</p><h2 id="scenarios-title"><!--[--><span class="">以下情况，更适合采用这种协作方式</span><!----><!--]--></h2><p><!--[-->如果需求非常标准且范围稳定，可以直接进入常规交付；当问题跨越内容、流程、质量、数据或AI工具时，前期诊断与验证更有价值。<!--]--></p></div><div class="scenario-grid"><!--[--><article><span>01</span><h3>内容和语种持续增长</h3><p>现有流程开始出现成本、时效、一致性或供应商协作压力。</p></article><article><span>02</span><h3>希望引入AI但缺少判断依据</h3><p>需要评估模型、内容适用性、质量风险和人工复核深度。</p></article><article><span>03</span><h3>质量问题反复出现</h3><p>问题能够被发现，却缺少统一标准、原因记录和回归复测。</p></article><article><span>04</span><h3>需求跨越多个环节</h3><p>需要同时协调内容、数据、语言人才、工具和内部业务团队。</p></article><!--]--></div></div></section><section class="section collaboration-section" aria-labelledby="collaboration-title"><div class="container"><div class="collaboration-heading"><p class="eyebrow eyebrow-light">CLEAR RESPONSIBILITIES</p><h2 id="collaboration-title"><!--[--><span class="collaboration-title-line">信息透明，责任清楚，</span><span class="collaboration-title-line">才能减少反复</span><!--]--></h2><p><!--[-->我们会在启动前确认双方需要提供的信息和承担的责任。实际分工根据项目范围调整，不把关键前提留到<span class="no-wrap-phrase">交付末期才讨论</span>。<!--]--></p></div><div class="responsibility-grid"><article><h3>客户侧通常需要</h3><ul class="check-list check-list-light"><!--[--><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>说明业务目标、目标市场和使用场景</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>提供必要的内容、样本、术语和现有流程信息</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>确认内部决策人、反馈人和验收标准</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>及时反馈需求变化和试点结果</span></li><!--]--></ul></article><article><h3>源译侧通常负责</h3><ul class="check-list check-list-light"><!--[--><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>梳理问题、风险、约束和可验证目标</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>设计并说明服务、流程、工具和质量方案</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>组织语言人才、试点和实际交付</span></li><li><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12l2 2l4-4"/></g></svg><span>记录关键决策、问题、变更和改进结果</span></li><!--]--></ul></article></div></div></section><section class="section section-contact" aria-label="联系合作"><div class="contact-card container"><div><p class="eyebrow eyebrow-light">START WITH A CONVERSATION</p><h2>需求沟通</h2><p>我们可以先根据现有信息判断：适合直接交付、先做样本试跑，还是需要进一步梳理流程和质量标准。</p></div><div class="contact-actions"><a href="/contact" class="button button-light"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--lucide" style="" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h10v10M7 17L17 7"/></svg> 联系合作</a><a href="/services" class="button button-outline-light">查看服务与经验</a></div></div></section></main><footer class="site-footer"><div class="container footer-grid"><div class="footer-brand"><a href="/" class="wordmark wordmark-footer" aria-label="返回首页"><span class="wordmark-symbol" aria-hidden="true"><span>Y</span></span><span class="wordmark-copy"><strong>源译</strong><small>YELINKTRANS</small></span></a><p>专注中国企业出海所需的多语言内容、数据与AI解决方案。</p></div><div><h2>快速导航</h2><!-- -hero-graphic reveal reveal-2" aria-hidden="true"><span class="page-hero-mesh"></span><span class="page-hero-orbit orbit-a"></span><span class="page-hero-orbit orbit-b"></span><span class="page-hero-connector connector-1"></span><span class="page-hero-connector connector-2"></span><span class="page-hero-connector connector-3"></span><span class="page-hero-core"><strong>Y</strong><small>YELINKTRANS</small></span><!--[--><span class="page-hero-tag-1 page-hero-tag"><small>01</small><strong>NOTICE</strong></span><span class="page-hero-tag-2 page-hero-tag"><small>02</small><strong>SECURITY</strong></span><span class="page-hero-tag-3 page-hero-tag"><small>03</small><strong>RIGHTS</strong></span><!--]--><span class="page-hero-graphic-caption">LANGUAGE × AI OPERATIONS</span></div></div></section><section class="section privacy-section"><div class="container privacy-layout"><aside class="privacy-nav" aria-label="隐私政策目录"><div class="privacy-date"><span>更新日期： 2026年8月14日</span><span>生效日期： 本网站正式上线之日</span></div><nav><!--[--><a href="#scope">一、适用范围</a><a href="#information">二、我们可能处理的信息</a><a href="#cookies">三、Cookie及类似技术</a><a href="#use">四、我们如何使用相关信息</a><a href="#sharing">五、委托处理、共享和披露</a><a href="#cross-border">六、跨境处理</a><a href="#retention">七、信息保存期限</a><a href="#security">八、信息安全</a><a href="#rights">九、您的权利</a><a href="#minors">十、未成年人信息</a><a href="#updates">十一、政策更新</a><a href="#contact">十二、联系我们</a><!--]--></nav></aside><article class="privacy-content"><!--[--><section id="scope"><h2>一、适用范围</h2><!--[--><p>本隐私政策适用于由无锡源译信息技术有限公司运营的 yelinktrans.com 及其中文、英文页面，说明我们在您访问本网站或通过网站公布的邮箱联系我们时，如何处理和保护相关个人信息。</p><p>本网站主要用于展示公司服务、行业经验和合作方式。当前版本不提供用户注册、在线留言、文件上传、在线支付或个性化推荐功能。</p><!--]--><!----><!--[--><!--]--></section><section id="information"><h2>二、我们可能处理的信息</h2><!--[--><!--]--><!----><!--[--><div class="privacy-subsection"><h3>1. 网站访问产生的技术信息</h3><!--[--><p>当您访问本网站时，网站托管、网络或安全服务可能自动生成必要的技术记录，包括：</p><!--]--><ul><!--[--><li>IP地址</li><li>访问日期和时间</li><li>访问的页面及来源页面</li><li>浏览器、设备和操作系统类型</li><li>页面错误及网络安全事件记录</li><li>这些信息主要用于保障网站正常运行、识别和处理安全风险、排查技术故障及履行适用的法律义务。</li><!--]--></ul></div><div class="privacy-subsection"><h3>2. 您主动通过邮件提供的信息</h3><!--[--><p>当您通过 James@yelinktrans.com 或 Mike@yelinktrans.com 联系我们时，我们可能处理您主动提供的信息，包括：</p><!--]--><ul><!--[--><li>姓名、公司、职位和联系方式</li><li>电子邮箱地址</li><li>项目背景、服务需求及沟通内容</li><li>您主动发送的文件、样本或其他资料</li><li>这些信息将用于回复咨询、了解项目需求、评估合作可行性、准备方案或报价，以及开展后续商务和项目沟通。</li><li>请不要在首次邮件中直接发送未经脱敏的个人敏感信息、客户数据、受保密协议约束的完整文件，或您无权向我们提供的信息。</li><!--]--></ul></div><!--]--></section><section id="cookies"><h2>三、Cookie及类似技术</h2><!--[--><p>本网站当前页面代码不设置营销Cookie，不接入广告追踪、用户画像或网站行为分析工具。</p><p>网站托管、内容分发或安全服务提供商可能使用保障网站正常访问和网络安全所必需的技术标识，但不会由我们用于个性化广告。</p><p>如果未来增加网站分析、营销追踪或其他非必要Cookie，我们将相应更新本政策，并根据适用法律提供必要的说明和选择机制。</p><!--]--><!----><!--[--><!--]--></section><section id="use"><h2>四、我们如何使用相关信息</h2><!--[--><p>我们仅在合理、必要的范围内使用相关信息，主要用于：</p><!--]--><ul><!--[--><li>展示和维护本网站</li><li>回复您的咨询和沟通项目需求</li><li>评估服务范围、项目风险和合作可行性</li><li>准备方案、报价、合同或项目安排</li><li>保障网站、邮箱和相关信息系统安全</li><li>履行适用的法律义务或处理争议</li><li>我们不会出售您的个人信息，也不会利用网站访问或邮件信息进行自动化决策、差别定价或个性化广告推送。</li><!--]--></ul><!--[--><!--]--></section><section id="sharing"><h2>五、委托处理、共享和披露</h2><!--[--><p>为了提供网站访问和电子邮件沟通，我们可能委托网站托管、内容分发、网络安全、企业邮箱、通信及必要的信息技术运维服务提供商处理必要信息。</p><p>我们将要求相关服务提供商仅在约定范围内处理信息，并采取与风险相适应的保护措施。</p><p>除以下情况外，我们不会向其他无关第三方提供或公开您的个人信息：</p><!--]--><ul><!--[--><li>已经取得您的同意</li><li>为订立或履行您作为一方当事人的合同所必需</li><li>为履行法定义务所必需</li><li>为保护您或他人的生命健康、财产安全所必需</li><li>法律法规规定的其他情形</li><li>如果因公司合并、分立、重组或资产转让等原因需要转移相关个人信息，我们将依法告知接收方信息，并要求接收方继续履行相应的保护义务。</li><!--]--></ul><!--[--><!--]--></section><section id="cross-border"><h2>六、跨境处理</h2><!--[--><p>由于本网站面向全球访问，企业邮箱或部分必要技术服务可能使用位于中国境外的基础设施。因此，您通过邮件提供的部分信息可能涉及跨境传输或境外处理。</p><p>发生此类处理时，我们将根据适用法律采取必要的安全保护措施，并在需要时另行告知境外接收方、处理目的、处理方式、信息种类以及您行使相关权利的方式，履行适用的个人信息保护影响评估、单独同意及其他数据出境要求。</p><!--]--><!----><!--[--><!--]--></section><section id="retention"><h2>七、信息保存期限</h2><!--[--><p>我们仅在实现处理目的所必要的期限内保存相关信息：</p><!--]--><ul><!--[--><li>网站访问及安全日志按照网站安全、故障排查和法律要求保存；适用法律要求留存网络日志的，按照相应期限执行。</li><li>一般咨询邮件保存至咨询处理完毕且没有合理的后续沟通需要。</li><li>如果双方建立业务合作，相关邮件、合同、项目及财务记录将按照合同履行、会计、税务、争议处理和法律要求保存。</li><li>保存期限届满后，我们将依法删除或匿名化处理相关个人信息；因备份或技术原因无法立即删除的，将停止除存储和安全保护以外的其他处理。</li><!--]--></ul><!--[--><!--]--></section><section id="security"><h2>八、信息安全</h2><!--[--><p>我们将根据实际处理的信息类型和风险，采取合理的管理和技术措施，降低个人信息遭到未经授权访问、泄露、篡改、丢失或滥用的风险。</p><p>如果发生或者可能发生个人信息安全事件，我们将及时采取补救措施，并按照适用法律履行报告和通知义务。</p><p>互联网传输无法保证绝对安全。请您在通过邮件发送重要资料前，与我们确认适合的文件传输和保护方式。</p><!--]--><!----><!--[--><!--]--></section><section id="rights"><h2>九、您的权利</h2><!--[--><p>在适用法律规定的范围内，您可以请求：</p><!--]--><ul><!--[--><li>查阅或复制您的个人信息</li><li>更正或补充不准确、不完整的信息</li><li>删除相关个人信息</li><li>限制或拒绝部分个人信息处理</li><li>撤回基于同意开展的个人信息处理</li><li>对个人信息处理规则进行解释说明</li><li>就个人信息保护问题提出投诉或意见</li><li>您可以通过 James@yelinktrans.com 联系我们。为保护信息安全，我们可能需要在处理请求前核实您的身份。</li><!--]--></ul><!--[--><!--]--></section><section id="minors"><h2>十、未成年人信息</h2><!--[--><p>本网站面向企业及专业客户，不以不满十四周岁的未成年人为目标用户，我们也不会主动收集不满十四周岁未成年人的个人信息。</p><p>如果我们发现相关信息是在未取得监护人同意的情况下提供的，将依法采取删除或其他必要措施。</p><!--]--><!----><!--[--><!--]--></section><section id="updates"><h2>十一、政策更新</h2><!--[--><p>我们可能根据网站功能、服务方式或适用法律的变化更新本政策。</p><p>如果更新对个人信息处理方式产生重要影响，我们将在网站适当位置进行说明，并更新本政策顶部的日期。</p><!--]--><!----><!--[--><!--]--></section><section id="contact"><h2>十二、联系我们</h2><!--[--><p>个人信息处理者：无锡源译信息技术有限公司</p><p>所在地：中国·江苏·无锡</p><p>联系邮箱：James@yelinktrans.com；Mike@yelinktrans.com</p><!--]--><!----><!--[--><!--]--></section><!--]--></article></div></section></main><footer class="site-footer"><div class="container footer-grid"><div class="footer-brand"><a href="/" class="wordmark wordmark-footer" aria-label="返回首页"><span class="wordmark-symbol" aria-hidden="true"><span>Y</span></span><span class="wordmark-copy"><strong>源译</strong><small>YELINKTRANS</small></span></a><p>专注中国企业出海所需的多语言内容、数据与AI解决方案。</p></div><div><h2>快速导航</h2><!--[--><a href="/" class="">首页</a><a href="/services" class="">服务与经验</a><a href="/approach" class="">协作方式</a><a href="/#about" class="">关于我们</a><a href="/contact" class="">联系合作</a><a aria-current="page" href="   <script>
    (() => {
      const pages = {"/":{"template":"review-home","title":"无锡源译｜AI驱动的多语言内容服务、数据与解决方案"},"/services":{"template":"review-services","title":"服务与经验｜多语言内容、数据与AI解决方案｜无锡源译"},"/approach":{"template":"review-approach","title":"协作方式｜从问题出发，让方案真正落地｜无锡源译"},"/contact":{"template":"review-contact","title":"联系合作｜无锡源译"},"/privacy":{"template":"review-privacy","title":"隐私政策｜无锡源译"}};
      const sourceLocale = "zh";
      const partnerFile = "源译官网_英文版_定稿_V1.1.html";
      const titleSuffix = "｜中文定稿 V1.0";
      const openMenuLabel = "打开菜单";
      const closeMenuLabel = "关闭菜单";
      const app = document.getElementById('review-app');

      function normalizePath(path) {
        const withoutLocale = path.replace(/^\/en(?=\/|$)/, '') || '/';
        return pages[withoutLocale] ? withoutLocale : '/';
      }

      function parseReviewLocation() {
        const value = location.hash.startsWith('#/') ? location.hash.slice(1) : '/';
        const [rawPath, query = ''] = value.split('?');
        const path = normalizePath(rawPath);
        const anchor = new URLSearchParams(query).get('anchor') || '';
        return { path, anchor };
      }

      function reviewHash(path, anchor = '') {
        return '#' + path + (anchor ? '?anchor=' + encodeURIComponent(anchor) : '');
      }

      function navigate(path, anchor = '') {
        const next = reviewHash(path, anchor);
        if (location.hash === next) render();
        else location.hash = next;
      }

      function routeFromHref(href) {
        if (!href || href.startsWith('mailto:') || href.startsWith('tel:')) return null;
        if (href.startsWith('http://') || href.startsWith('https://') || href.startsWith('//')) return null;

        if (href.startsWith('#')) {
          return { path: parseReviewLocation().path, anchor: href.slice(1) };
        }

        const url = new URL(href, 'https://review.local');
        const path = normalizePath(url.pathname);
        return { path, anchor: url.hash.slice(1) };
      }

      function bindNavigation() {
        const toggle = app.querySelector('.menu-toggle');
        const nav = app.querySelector('.primary-nav');
        const closeMenu = () => {
          nav?.classList.remove('is-open');
          toggle?.setAttribute('aria-expanded', 'false');
          toggle?.setAttribute('aria-label', openMenuLabel);
        };

        toggle?.addEventListener('click', () => {
          const isOpen = nav?.classList.toggle('is-open') ?? false;
          toggle.setAttribute('aria-expanded', String(isOpen));
          toggle.setAttribute('aria-label', isOpen ? closeMenuLabel : openMenuLabel);
        });

        app.querySelectorAll('a[href]').forEach((link) => {
          link.addEventListener('click', (event) => {
            const target = routeFromHref(link.getAttribute('href'));
            if (!target) return;
            event.preventDefault();
            closeMenu();

            if (link.classList.contains('language-link')) {
              location.href = partnerFile + reviewHash(target.path, target.anchor);
              return;
            }

            navigate(target.path, target.anchor);
          });
        });
      }

      function render() {
        const { path, anchor } = parseReviewLocation();
        const page = pages[path];
        const template = document.getElementById(page.template);
        app.replaceChildren(template.content.cloneNode(true));
        document.title = page.title + titleSuffix;
        document.documentElement.lang = sourceLocale === 'en' ? 'en-US' : 'zh-CN';
        bindNavigation();

        requestAnimationFrame(() => {
          if (anchor) {
            document.getElementById(anchor)?.scrollIntoView({ block: 'start' });
          } else {
            window.scrollTo({ top: 0, left: 0 });
          }
        });
      }

      window.addEventListener('hashchange', render);
      if (!location.hash.startsWith('#/')) location.replace(reviewHash('/'));
      else render();
    })();
  </script>
